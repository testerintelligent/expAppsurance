#version: '3.8'

services:
  # Policies Centre
  policiescentre:
    build:
      context: ./Policies
      dockerfile: Dockerfile.policy
      args:
        REACT_APP_API_URL: http://localhost:5000
    ports:
      - "3001:3001"
    depends_on:
      - server
    networks:
      - app-network
    restart: unless-stopped

  # Claims Centre
  claimscentre:
    build:
      context: ./Claims
      dockerfile: Dockerfile.claim
      args:
        REACT_APP_API_URL: http://localhost:5000/api
    ports:
      - "3003:3003"
    depends_on:
      - server
    networks:
      - app-network
    restart: unless-stopped

  # Billing Centre
  billingcentre:
    build:
      context: ./billing-center
      dockerfile: Dockerfile.billing
      args:
        APP_ENV: ${APP_ENV:-production}
    ports:
      - "3002:80"
    depends_on:
      - server
    networks:
      - app-network
    restart: unless-stopped

  # Pricing app
  pricingapp:
    build:
      context: ./pricing_app
      dockerfile: Dockerfile.pricing
      args:
        APP_ENV: ${APP_ENV:-production}
    ports:
      - "3004:80"
    depends_on:
      - server
    networks:
      - app-network
    restart: unless-stopped

  # Main Server
  server:
    build:
      context: ./Server
      dockerfile: Dockerfile.server
      args:
        APP_ENV: ${APP_ENV:-production}
    ports:
      - "5000:5000" #Change the postnumber from 5000 to 5001 to avoid conflict with micro-service
    environment:
      MONGO_URI: mongodb://mongo:27017/registeredUser
    depends_on:
      - mongo
    networks:
      - app-network
    restart: unless-stopped

  # Micro Service (Premium)
  micro-service:
    build:
      context: ./Services/premium-service
      dockerfile: Dockerfile.server
    ports:
      - "5001:5001"
    environment:
      - MONGO_URI=mongodb://mongo:27017/registeredUser
    depends_on:
      - mongo
    networks:
      - app-network
    restart: unless-stopped

  # Mongo Database
  mongo:
    image: mongo:8.2.3
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - app-network
    restart: unless-stopped

# Named volume for MongoDB persistence
volumes:
  mongo_data:

# Explicit network for stable container DNS
networks:
  app-network:
    driver: bridge
